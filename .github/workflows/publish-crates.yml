name: Publish to crates.io

# Publishes all workspace crates to crates.io in dependency order.
#
# Auth: uses the CARGO_REGISTRY_TOKEN secret when present (bootstrap path —
# crates.io can't configure Trusted Publishing for a crate that doesn't exist
# yet), otherwise exchanges the GitHub OIDC token for a short-lived crates.io
# token. Once Trusted Publishing is configured per crate and the secret is
# removed, publishes run entirely over OIDC with no stored credentials.

# Tag-triggered (`v*`) for releases, mirroring buffa's publish-crates
# workflow. The `workflow_dispatch` path remains for re-runs and dry-run
# verification. On a tag push `inputs.dry_run` is undefined → falsy → no
# `--dry-run` flag, so a tag push is always a real publish.
#
# Supply-chain guards: the "release tags" repository ruleset restricts
# `refs/tags/v*` creation/update/deletion to repository admins and
# requires signed tags, so a non-admin cannot push a tag that triggers
# this. The `crates-io` GitHub Environment additionally restricts which
# refs may run inside it (`v*` tags and `main`), so a feature branch
# cannot dispatch a publish either. There is no human-approval gate on
# the publish step itself once a release tag exists; if that is wanted,
# add a required-reviewer to the `crates-io` environment.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: >-
          Run cargo publish --dry-run (no upload, no auth). Tier-1 crates
          (connectrpc, connectrpc-codegen, connectrpc-types) fully verify;
          tier-2 crates fail
          verification until tier-1 is actually published (dep resolution
          hits crates.io, not the workspace). Expected.
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write  # OIDC for crates.io Trusted Publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    # GitHub Environment: part of the Trusted Publishing trust config on
    # crates.io, and lets you add a required-reviewer approval gate.
    environment: crates-io
    env:
      DRY_RUN_FLAG: ${{ inputs.dry_run && '--dry-run' || '' }}
      # Bootstrap token. Empty if secret is unset → Trusted Publishing path.
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      # OIDC token exchange. Skipped in dry-run (never hits crates.io) and
      # bootstrap (secret present). The action's post-step revokes the token.
      - name: Authenticate (Trusted Publishing)
        id: auth
        if: ${{ !inputs.dry_run && env.CARGO_REGISTRY_TOKEN == '' }}
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4 (sha-pinned)

      - name: Use Trusted Publishing token
        if: ${{ steps.auth.outputs.token != '' }}
        run: echo "CARGO_REGISTRY_TOKEN=${{ steps.auth.outputs.token }}" >> "$GITHUB_ENV"

      # Dependency order. cargo publish (≥1.66) blocks until the crate is
      # indexed, so sequential steps work without manual delays.
      #
      # Each step is idempotent: if the crate is already published at this
      # version, the step logs a notice and succeeds. Re-running the workflow
      # after a partial failure skips what's done and picks up where it left
      # off — no manual editing needed.

      - name: Create idempotent publish helper
        run: |
          cat > /tmp/publish.sh << 'EOF'
          #!/bin/bash
          set -o pipefail
          crate="$1"; shift
          cargo publish -p "$crate" "$@" 2>&1 | tee /tmp/publish.log
          status=${PIPESTATUS[0]}
          if [ $status -ne 0 ] && grep -qE "already (exists|uploaded)" /tmp/publish.log; then
            echo "::notice::$crate already published at this version; skipping"
            exit 0
          fi
          exit $status
          EOF
          chmod +x /tmp/publish.sh

      - name: Publish connectrpc
        run: /tmp/publish.sh connectrpc $DRY_RUN_FLAG

      - name: Publish connectrpc-codegen
        run: /tmp/publish.sh connectrpc-codegen $DRY_RUN_FLAG

      # No workspace dependencies, so it fully verifies in a dry run; kept
      # with the tier-1 crates, ahead of the tier-2 steps that fail there.
      - name: Publish connectrpc-types
        run: /tmp/publish.sh connectrpc-types $DRY_RUN_FLAG

      - name: Publish connectrpc-build
        run: /tmp/publish.sh connectrpc-build $DRY_RUN_FLAG

      - name: Publish connectrpc-health
        run: /tmp/publish.sh connectrpc-health $DRY_RUN_FLAG

      - name: Publish connectrpc-reflection
        run: /tmp/publish.sh connectrpc-reflection $DRY_RUN_FLAG
