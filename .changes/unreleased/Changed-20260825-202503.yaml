kind: Changed
body: |-
  **Breaking for custom `ClientTransport` implementations: the response
  body's error type must now convert into
  `Box<dyn std::error::Error + Send + Sync>`.** `call_unary`,
  `call_unary_get`, `call_server_stream`, `call_client_stream`,
  `call_bidi_stream`, `ServerStream`, `BidiStream`, `BidiRecvHalf` and the
  generated clients previously bounded `<T::ResponseBody as Body>::Error`
  only by `Display`; they now require
  `Into<Box<dyn std::error::Error + Send + Sync>>`, which every
  `std::error::Error + Send + Sync + 'static` type satisfies and so does
  that boxed type itself. A transport whose body error type implements
  `Display` alone no longer compiles against them. Both built-in transports
  meet the bound (`hyper::body::Incoming` fails with `hyper::Error`), as do
  `http_body_util`'s `Full`, `Empty`, `Limited` and `Either` and a
  `BoxBody<_, Box<dyn Error + Send + Sync>>`, so only a hand-written body
  type is affected; implement `std::error::Error` for its error type or
  adapt the body with `http_body_util::BodyExt::map_err`.
  `ServiceTransport`'s blanket impl is relaxed to the same bound from the
  stricter `Error + Send + Sync + 'static` it required before. Checked-in
  clients generated by 0.9.0 no longer compile against this runtime: their
  `impl` block still declares the `Display` bound and calls into functions
  that need the stronger one. Regenerate with the matching
  `protoc-gen-connect-rust`; `connectrpc-build` users regenerate
  automatically.

  In return, a failure while reading the response body — a stream reset
  mid-body — now keeps the transport's error as the surfaced
  `ConnectError`'s `source()`, the way send-time failures have since
  `ConnectError::with_source` landed; its `Display` text still goes in
  `message`. The one client-side transport fault that was previously
  opaque to `downcast_ref` is now inspectable. A body read that fails
  after the call deadline has passed is still reported as
  `deadline_exceeded` and now carries that read error as its source too; a
  `deadline_exceeded` from the local timer remains source-less, as there
  is nothing to attach ([#276]).

  [#276]: https://github.com/connectrpc/connect-rust/issues/276
time: 2026-08-25T20:25:03.000000000+00:00
