kind: Changed
body: |-
    **`SharedHttp2Connection` sends directly on the hyper connection handle
    instead of through a `tower::buffer` worker.** Each request clones the live
    hyper request handle and sends on it, taking the reconnect state machine's
    lock only when there is no open connection, which removes the worker task
    and its per-call hop and wakeups. `Http2Connection::shared(bound)` keeps its
    signature and `bound` keeps its role: it is the number of requests that may
    wait for the connection to be (re-)established at once (previously the
    worker's queue depth), never a cap on concurrent streams. It must still be
    non-zero. As a `tower::Service` the handle keeps `Http2Connection`'s
    readiness contract (`poll_ready` drives re-establishment and is pending
    meanwhile; a failed attempt is ready with the error returned by the next
    `call`), and `call` without a successful `poll_ready` returns an `internal`
    error where the buffer used to panic. `shared` no longer has to be called
    inside a Tokio runtime, and `Debug` output now includes the endpoint URI.
    No downstream action is needed.
