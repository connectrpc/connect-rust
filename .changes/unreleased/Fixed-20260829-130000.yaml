kind: Fixed
body: |-
    **Compressed response frames no longer pin their whole working buffer.**
    The gzip and zstd encoders size their output buffer to the input length
    or a little over, and the buffer became the frame's `Bytes` with that
    capacity intact, so a queued compressible frame held about its
    uncompressed size in memory until HTTP/2 wrote it. Incompressible input
    at gzip's default fast level also outgrew the gzip buffer, which then
    doubled. Both encoders now give back the unused capacity when the
    compressed frame is under half of it, and the gzip buffer is sized from
    deflate's worst-case bound, so it no longer grows. A queued compressible
    frame now pins at most about twice its compressed size; an
    incompressible one, about its input size.
