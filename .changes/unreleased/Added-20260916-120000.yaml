kind: Added
body: |-
    **`Server::serve_connection` and `ConnectionInfo`: serve a connection you
    accepted yourself.** `Server::serve_connection(io, info, shutdown)` serves
    one already-accepted (and, over TLS, already-handshaken) stream with the
    server's service and every connection setting configured on it — HTTP/1.1 /
    HTTP/2 settings, keepalive, header-read timeout, max age / idle / request
    retirement, graceful GOAWAY on `shutdown`, panic isolation — on whichever
    runtime polls it, and resolves to a `ConnectionClosed` whose `reason()`
    (`CloseReason::{Closed, Shutdown, MaxAge, Idle, MaxRequests, Error}`) says
    how it ended. The new public `ConnectionInfo` (also at the crate root)
    describes the connection: `peer_addr()`, `peer_certs()`, and
    connection-scoped `extensions_mut()` that the loop fills once — a parsed
    client-certificate identity, say — and that are cloned into every request
    on the connection. `PeerAddr` / `PeerCerts` on requests always come from
    `ConnectionInfo`'s typed fields, never from its extensions. A loop that
    admits connections by client identity, caps them per tenant, or places
    them on different runtimes keeps every guarantee of `Server::serve`
    ([#191], [#49]).

    [#191]: https://github.com/connectrpc/connect-rust/issues/191
    [#49]: https://github.com/connectrpc/connect-rust/issues/49
