kind: Changed
body: |-
    **Client-streaming and bidi handlers receive request messages without a
    task hand-off per message.** The request stream handed to the handler now
    decodes envelopes from the HTTP body as the handler polls it, instead of
    being fed through a bounded channel by a separately spawned reader task, so
    a message no longer crosses two extra tasks (and, on a multi-threaded
    runtime, usually two worker threads) between the connection and the
    handler. Whatever a handler leaves unread is still drained in the
    background, bounded as before, so HTTP/1.1 connections stay reusable.
