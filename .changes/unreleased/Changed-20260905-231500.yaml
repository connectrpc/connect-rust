kind: Changed
body: |-
    **Updated to buffa 0.9.2; `connectrpc-health` and `connectrpc-reflection`
    ship message code regenerated with it.** buffa 0.9.2 is a hardening
    release: on the generated path, `decode_view` now attaches the
    element-memory budget and the view decoders merge split map values the way
    the owned decoder does. `connectrpc-build` users pick this up on their next
    build; `buf generate` and `protoc-gen-connect-rust` users should reinstall
    `protoc-gen-buffa` at 0.9.2 and regenerate, although code generated by
    0.9.1 still compiles and runs against the new runtime.
time: 2026-09-05T23:15:00.000000000+00:00
