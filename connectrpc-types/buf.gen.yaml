# Code generation configuration for connectrpc-types.
#
# The google.rpc protos are vendored from googleapis under proto/ rather than
# pulled from the Buf Schema Registry: googleapis moves often, and an unpinned
# module input would let the check-generated-code job go stale without a
# change in this repo. The generated code is checked in, so neither buf nor
# protoc is needed to build the crate:
#   task connectrpc-types:generate
#
# No connect plugin: google.rpc declares messages and an enum, no services.
version: v2
plugins:
  - local: ../../buffa/target/release/protoc-gen-buffa
    out: src/generated/buffa
    # Unknown fields are kept (the default), unlike the health and reflection
    # crates: those decode requests they answer themselves, whereas these
    # types are the ones a proxy or middleware decodes and passes on, and a
    # `Status` relayed through it should not lose fields it does not know.
    #
    # `google.protobuf` (the `Any` in `Status.details`, the `Duration` in
    # `RetryInfo`) maps to buffa-types without an `extern_path`, so the
    # details are the same `Any` the rest of the ecosystem uses.
    opt: [views=true, json=true]
  - local: ../../buffa/target/release/protoc-gen-buffa-packaging
    out: src/generated/buffa
    strategy: all
