version: v2
plugins:
  - local: ../../buffa/target/release/protoc-gen-buffa
    out: src/generated/buffa
    # `unknown_fields=false`: nothing in the health service reads or
    # re-emits unknown fields, so the generated types skip them on decode
    # instead of recording them — smaller structs (no
    # `__buffa_unknown_fields`) and no per-field bookkeeping on the request
    # path.
    opt: [views=true, json=true, unknown_fields=false]
  - local: ../../buffa/target/release/protoc-gen-buffa-packaging
    out: src/generated/buffa
    strategy: all
  - local: ../target/release/protoc-gen-connect-rust
    out: src/generated/connect
    # `gate_client_feature` puts every emitted `HealthClient<T>` item
    # behind `#[cfg(feature = "client")]` so a server-only build of
    # `connectrpc-health` can drop `connectrpc/client` from the
    # dependency graph. The feature is wired up in this crate's
    # Cargo.toml under `[features] client = ["connectrpc/client"]`.
    opt: [buffa_module=crate::proto, gate_client_feature]
  - local: ../../buffa/target/release/protoc-gen-buffa-packaging
    out: src/generated/connect
    strategy: all
    opt: [filter=services]
